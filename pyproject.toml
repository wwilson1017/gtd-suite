[project]
name = "todo-gtd"
version = "0.1.0"
description = "A no-login GTD todo list that AI tools can read and write"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "fastmcp==4.1.6",  # the MCP server (backend/mcp_server.py), on the official mcp SDK
    "httpx2==2.16.0",  # sign-in mail (Resend's HTTP API); also what the test client uses
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from other test modules look like redefinitions
"backend/tests/**" = ["F811"]

[tool.pyright]
include = ["backend", "scripts"]
# simplification: tests are not type-checked yet; drop backend/tests from exclude to add them.
exclude = ["backend/tests", "backend/static", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = ["objectstore: the provider test against the store in FILES_S3_* (skipped without it)"]
